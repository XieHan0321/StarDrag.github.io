<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assignment 3 - Harbor Sky Calibration</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar" aria-label="Prototype header">
        <div class="title-group">
          <p class="eyebrow">Assignment 3 Prototype</p>
          <h1>Harbor Sky Calibration</h1>
        </div>

        <section class="progress-panel" aria-label="Alignment progress">
          <span id="scoreLabel" class="score-label">0 / 7 aligned</span>
          <div class="progress-track" aria-hidden="true">
            <div id="scoreBar" class="progress-fill"></div>
          </div>
        </section>

        <nav class="icon-actions" aria-label="Prototype controls">
          <button id="resetBtn" class="icon-button" type="button" title="Reset field">
            <span aria-hidden="true">&#8634;</span>
            <span class="sr-only">Reset field</span>
          </button>
          <button id="hintBtn" class="icon-button" type="button" aria-pressed="false" title="Reveal targets">
            <span aria-hidden="true">?</span>
            <span class="sr-only">Reveal targets</span>
          </button>
        </nav>
      </header>

      <section class="stage" aria-label="Interactive harbor constellation">
      <p id="stageHelp" class="sr-only">
          Drag each bright beacon toward its matching pale target ring.
        </p >

        <div id="starField" class="star-field" aria-describedby="stageHelp statusText">
          <div class="sky-dot dot-1"></div>
          <div class="sky-dot dot-2"></div>
          <div class="sky-dot dot-3"></div>
          <div class="sky-dot dot-4"></div>
          <div class="sky-dot dot-5"></div>
          <div class="sky-dot dot-6"></div>
          <div class="sky-dot dot-7"></div>
          <div class="sky-dot dot-8"></div>
          <div class="sky-dot dot-9"></div>
          <div class="sky-dot dot-10"></div>
          <div class="sky-dot dot-11"></div>
          <div class="sky-dot dot-12"></div>

          <div class="target-ring" data-index="0" aria-hidden="true"></div>
          <div class="target-ring" data-index="1" aria-hidden="true"></div>
          <div class="target-ring" data-index="2" aria-hidden="true"></div>
          <div class="target-ring" data-index="3" aria-hidden="true"></div>
          <div class="target-ring" data-index="4" aria-hidden="true"></div>
          <div class="target-ring" data-index="5" aria-hidden="true"></div>
          <div class="target-ring" data-index="6" aria-hidden="true"></div>

          <button class="beacon" data-index="0" type="button">Pier Light</button>
          <button class="beacon" data-index="1" type="button">Signal Mast</button>
          <button class="beacon" data-index="2" type="button">Fog Bell</button>
          <button class="beacon" data-index="3" type="button">Dock Beacon</button>
          <button class="beacon" data-index="4" type="button">Outer Buoy</button>
          <button class="beacon" data-index="5" type="button">Tide Gauge</button>
          <button class="beacon" data-index="6" type="button">Watch Room</button>

          <div class="harbor-shape harbor-1"></div>
          <div class="harbor-shape harbor-2"></div>
          <div class="harbor-shape harbor-3"></div>
          <div class="harbor-shape harbor-4"></div>
          <div class="water-line water-1"></div>
          <div class="water-line water-2"></div>
          <div class="water-line water-3"></div>
        </div>
        
        <aside class="signal-strip" aria-live="polite" aria-atomic="true">
          <p id="statusText">Beacon field: unsettled.</p>
          <p id="completionText" hidden>Signal aligned. The harbor constellation is ready.</p>
        </aside>
      </section>
    </main>

    <script src="./js/script.js" defer></script>
  </body>
</html>
